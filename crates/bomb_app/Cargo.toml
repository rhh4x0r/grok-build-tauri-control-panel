[package]
name = "bomb_app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bomb Code — GPUI desktop control panel for ACP coding agents"
default-run = "bomb_app"

[dependencies]
bomb_foundry = { path = "../bomb_foundry" }
anyhow.workspace = true
async-channel = "2"
base64 = "0.22"
bomb_core = { path = "../bomb_core" }
chrono.workspace = true
gpui-wry = "=0.6.1"
wry = { package = "lb-wry", version = "=0.53.3" }
gpui-kit = { version = "=0.6.1", features = ["tree-sitter-diff", "tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-javascript", "tree-sitter-bash", "tree-sitter-markdown", "tree-sitter-markdown-inline", "tree-sitter-toml", "tree-sitter-python", "tree-sitter-yaml"] }
grok_cli_wrapper = { path = "../grok_cli_wrapper" }
grok_config = { path = "../grok_config" }
grok_control_core = { path = "../grok_control_core" }
grok_events = { path = "../grok_events" }
grok_mcp = { path = "../grok_mcp" }
grok_memory = { path = "../grok_memory" }
grok_permissions = { path = "../grok_permissions" }
grok_persistence = { path = "../grok_persistence" }
grok_worktree = { path = "../grok_worktree" }
serde.workspace = true
bomb_link = { path = "../bomb_link" }
bomb_proto = { path = "../bomb_proto" }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
vt100 = "0.16"

[dev-dependencies]
bomb_server = { path = "../bomb_server" }
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
